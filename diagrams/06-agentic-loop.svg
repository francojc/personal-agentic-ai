<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Agentic Loop</title><desc id="desc">From generating a response to pursuing a goal through action and feedback. Simplified flow · tool actions stay within configured permissions</desc><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3266C7"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087D79"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7655BB"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A86414"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="900" fill="#F7F8FC"/><g id="heading"><text x="64" y="53" font-size="18" fill="#596980" font-weight="700" text-anchor="start">AGENTIC AI  /  WORKING GROUP</text><text x="64" y="116" font-size="48" fill="#18263C" font-weight="700" text-anchor="start">The Agentic Loop</text><text x="66" y="159" font-size="25" fill="#596980" font-weight="400" text-anchor="start">From generating a response to pursuing a goal through action and feedback.</text><rect x="1430" y="64" width="106" height="44" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="1483.0" y="94" font-size="24" fill="#3266C7" font-weight="600" text-anchor="middle">06</text></g><g id="traditional-container"><rect x="64" y="208" width="1472" height="166" rx="22" fill="#FFFFFF" stroke="#C9D3E1" stroke-width="2"/><text x="92" y="246" font-size="18" fill="#596980" font-weight="700" text-anchor="start">TRADITIONAL CHAT</text></g><g id="traditional-prompt"><rect x="310" y="258" width="246" height="65" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="433" y="300" font-size="28" fill="#3266C7" font-weight="600" text-anchor="middle">Prompt</text></g><g id="traditional-model"><rect x="660" y="267" width="246" height="44" rx="22" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="783.0" y="297" font-size="28" fill="#7655BB" font-weight="600" text-anchor="middle">Model</text></g><g id="traditional-answer"><rect x="1010" y="258" width="246" height="65" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="1133" y="300" font-size="28" fill="#3266C7" font-weight="600" text-anchor="middle">Answer</text></g><g id="traditional-flow"><path d="M557 289 H642" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><path d="M907 289 H992" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><text x="1360" y="284" font-size="25" fill="#596980" font-weight="600" text-anchor="middle">One pass</text><text x="1360" y="315" font-size="21" fill="#596980" font-weight="400" text-anchor="middle">to a response</text></g><g id="loop-container"><rect x="64" y="402" width="1472" height="382" rx="22" fill="#FFFFFF" stroke="#C9D3E1" stroke-width="2"/><text x="92" y="445" font-size="18" fill="#7655BB" font-weight="700" text-anchor="start">AGENTIC WORK</text><text x="92" y="485" font-size="26" fill="#18263C" font-weight="600" text-anchor="start">A goal starts a cycle of decisions, actions, and checks.</text></g><g id="agentic-prompt"><rect x="92" y="535" width="156" height="110" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="170" y="578" font-size="24" fill="#3266C7" font-weight="700" text-anchor="middle">Prompt</text><text x="170" y="615" font-size="18" fill="#596980" font-weight="400" text-anchor="middle">Goal + context</text></g><g id="prompt-to-understand"><path d="M250 590 H268" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="step-understand"><path d="M296,535 H404 L428,590.0 L404,645 H296 L272,590.0 Z" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="350" y="578" font-size="22" fill="#7655BB" font-weight="700" text-anchor="middle">Understand</text><text x="350" y="615" font-size="17" fill="#596980" font-weight="400" text-anchor="middle">Interpret goal</text></g><g id="flow-understand"><path d="M430 590 H448" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="step-plan"><path d="M476,535 H584 L608,590.0 L584,645 H476 L452,590.0 Z" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="530" y="578" font-size="22" fill="#7655BB" font-weight="700" text-anchor="middle">Plan</text><text x="530" y="615" font-size="17" fill="#596980" font-weight="400" text-anchor="middle">Choose steps</text></g><g id="flow-plan"><path d="M610 590 H628" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="step-choose-tool"><path d="M650,535 H770 L788,553 V627 L770,645 H650 L632,627 V553 Z" fill="#E6F5F1" stroke="#087D79" stroke-width="2"/><text x="710" y="578" font-size="22" fill="#087D79" font-weight="700" text-anchor="middle">Choose tool</text><text x="710" y="615" font-size="17" fill="#596980" font-weight="400" text-anchor="middle">Select capability</text></g><g id="flow-choose-tool"><path d="M790 590 H808" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="step-act"><path d="M830,535 H950 L968,553 V627 L950,645 H830 L812,627 V553 Z" fill="#E6F5F1" stroke="#087D79" stroke-width="2"/><text x="890" y="578" font-size="22" fill="#087D79" font-weight="700" text-anchor="middle">Act</text><text x="890" y="615" font-size="17" fill="#596980" font-weight="400" text-anchor="middle">Run the tool</text></g><g id="flow-act"><path d="M970 590 H988" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="step-observe"><path d="M1016,535 H1124 L1148,590.0 L1124,645 H1016 L992,590.0 Z" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="1070" y="578" font-size="22" fill="#7655BB" font-weight="700" text-anchor="middle">Observe</text><text x="1070" y="615" font-size="17" fill="#596980" font-weight="400" text-anchor="middle">Inspect result</text></g><g id="flow-observe"><path d="M1150 590 H1168" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="step-revise"><path d="M1196,535 H1304 L1328,590.0 L1304,645 H1196 L1172,590.0 Z" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="1250" y="578" font-size="22" fill="#7655BB" font-weight="700" text-anchor="middle">Revise</text><text x="1250" y="615" font-size="17" fill="#596980" font-weight="400" text-anchor="middle">Adjust plan</text></g><g id="completion"><path d="M1330 590 H1348" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="1352" y="535" width="156" height="110" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="1430" y="578" font-size="24" fill="#3266C7" font-weight="700" text-anchor="middle">Answer</text><text x="1430" y="615" font-size="18" fill="#596980" font-weight="400" text-anchor="middle">Goal met</text></g><g id="iteration-feedback"><path d="M1250 646 V705 H530 V650" fill="none" stroke="#087D79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#teal-arrow)"/><text x="890" y="742" font-size="24" fill="#087D79" font-weight="600" text-anchor="middle">Continue if more work is needed</text></g><g id="footer"><path d="M64 816 H1536" stroke="#C9D3E1"/><path d="M66 851 H111" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><text x="126" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Flow</text><path d="M210 851 H255" fill="none" stroke="#087D79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#teal-arrow)"/><text x="270" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Feedback / context</text><text x="660" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Simplified flow · tool actions stay within configured permissions</text><text x="1536" y="859" font-size="18" fill="#596980" font-weight="600" text-anchor="end">06</text></g></g></svg>