<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">A Researcher’s AI Workspace</title><desc id="desc">One research goal, an iterative workflow, and a gateway that manages model use. Illustrative workflow · routing and controls depend on configuration</desc><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3266C7"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087D79"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7655BB"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A86414"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="900" fill="#F7F8FC"/><g id="heading"><text x="64" y="53" font-size="18" fill="#596980" font-weight="700" text-anchor="start">AGENTIC AI  /  WORKING GROUP</text><text x="64" y="116" font-size="48" fill="#18263C" font-weight="700" text-anchor="start">A Researcher’s AI Workspace</text><text x="66" y="159" font-size="25" fill="#596980" font-weight="400" text-anchor="start">One research goal, an iterative workflow, and a gateway that manages model use.</text><rect x="1430" y="64" width="106" height="44" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="1483.0" y="94" font-size="24" fill="#3266C7" font-weight="600" text-anchor="middle">10</text></g><g id="label-researcher"><text x="64" y="228" font-size="18" fill="#3266C7" font-weight="700" text-anchor="start">RESEARCHER</text><text x="64" y="256" font-size="18" fill="#596980" 