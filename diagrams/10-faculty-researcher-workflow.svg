xt-anchor="middle">Review progress → receive findings, figures, and a draft</text></g><g id="workspace-to-agent"><path d="M938 379 V409" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="knowledge"><path d="M340,412 H586 L610,436 V542 H340 Z M586,412 V436 H610" fill="#E6F5F1" stroke="#087D79" stroke-width="2" stroke-linejoin="round"/><text x="475" y="449" font-size="24" fill="#087D79" font-weight="700" text-anchor="middle">Project knowledge</text><text x="475" y="489" font-size="21" fill="#596980" font-weight="400" text-anchor="middle">Papers · notes · data</text><text x="475" y="521" font-size="18" fill="#596980" font-weight="400" text-anchor="middle">Selected source material</text></g><g id="research-agent"><path d="M694,412 H1182 L1206,477.0 L1182,542 H694 L670,477.0 Z" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="938" y="449" font-size="28" fill="#7655BB" font-weight="700" text-anchor="middle">Research agent</text><text x="938" y="490" font-size="27" fill="#18263C" font-weight="600" text-anchor="middle">Review → Analyze → Draft</text><text x="938" y="522" font-size="21" fill="#596980" font-weight="400" text-anchor="middle">Inspect results · revise · synthesize</text></g><g id="tools"><path d="M1284,412 H1518 L1536,430 V524 L1518,542 H1284 L1266,524 V430 Z" fill="#E6F5F1" stroke="#087D79" stroke-width="2"/><text x="1401" y="449" font-size="26" fill="#087D79" font-weight="700" text-anchor="middle">Tools</text><text x="1401" y="489" font-size="21" fill="#596980" font-weight="400" text-anchor="middle">Search · Python · files</text><text x="1401" y="521" font-size="18" fill="#596980" font-weight="400" text-anchor="middle">Configured capabilities</text></g><g id="agent-knowledge-loop"><path d="M613 477 H667" fill="none" stroke="#087D79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/></g><g id="agent-tools-loop"><path d="M1209 477 H1263" fill="none" stroke="#087D79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/></g><g id="agent-to-gateway"><path d="M938 543 V579" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="bifrost"><rect x="340" y="582" width="1196" height="142" rx="22" fill="#FFF3DC" stroke="#A86414" stroke-width="2"/><text x="938" y="619" font-size="30" fill="#A86414" font-weight="700" text-anchor="middle">Bifrost · routing + controls</text><g id="routing"><text x="538" y="660" font-size="18" fill="#A86414" font-weight="700" text-anchor="middle">MODEL ROUTING</text><text x="538" y="699" font-size="23" fill="#18263C" font-weight="400" text-anchor="middle">Task fit · fallback routes</text></g><g id="security"><text x="938" y="660" font-size="18" fill="#A86414" font-weight="700" text-anchor="middle">SECURITY</text><text x="938" y="699" font-size="23" fill="#18263C" font-weight="400" text-anchor="middle">Access rules · data policies</text></g><g id="observability"><text x="1338" y="660" font-size="18" fill="#A86414" font-weight="700" text-anchor="middle">COST + VISIBILITY</text><text x="1338" y="699" font-size="23" fill="#18263C" font-weight="400" text-anchor="middle">Budgets · logs · usage</text></g><path d="M738 644 V708 M1138 644 V708" fill="none" stroke="#D8B780" stroke-width="1.5"/></g><g id="gateway-to-models"><path d="M938 725 V743 H528 V763" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><path d="M938 743 V763" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><path d="M938 743 H1348 V763" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marke