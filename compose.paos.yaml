# PAOS services (Compose project "paos"). Multica runs as a SEPARATE project ("multica")
# from vendor/multica. Always drive both through scripts/paos.sh – never merge or mix invocations.
# See docs/DEPLOYMENT.md, docs/GATEWAY-CONTRACT.md.
name: paos

services:
  bifrost:
    # Pin by tag now; replace with image digest before go-live (step 21).
    image: maximhq/bifrost:${BIFROST_TAG:-v2.2.5}
    restart: unless-stopped
    environment:
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:?run scripts/paos.sh init-secrets}
      ZEN_API_KEY: ${ZEN_API_KEY:-}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:?run scripts/paos.sh init-secrets}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:?run scripts/paos.sh init-secrets}
      PAOS_WORKER_VK: ${PAOS_WORKER_VK:?run scripts/paos.sh init-secrets}
    volumes:
      - bifrost-data:/app/data
      - ./config/paos/bifrost/config.json:/app/data/config.json:ro
    ports:
      # Loopback only: Docker-published ports bypass UFW. Admin/inference listener; the worker is
      # kept off it by host network policy (step 11) and reaches only the filtered gateway port.
      - "127.0.0.1:${BIFROST_ADMIN_PORT:-8081}:8080"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    networks: [paos_net]

  gateway-filter:
    # Path-filtering front for the worker (chat completions only). Pin by digest in step 21.
    image: nginxinc/nginx-unprivileged:${NGINX_TAG:-1.28-alpine}
    restart: unless-stopped
    depends_on:
      bifrost:
        condition: service_healthy
    volumes:
      - ./config/paos/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GATEWAY_FILTER_PORT:-8082}:8082"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    networks: [paos_net]

networks:
  paos_net:
    name: paos_net

volumes:
  bifrost-data:
