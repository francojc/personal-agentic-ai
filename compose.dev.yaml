# Optional development layer for Personal Agentic AI.
#
# Run merged with the core stack (core must be started first so the shared
# network and TSDProxy exist):
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# Add the agent tool bridge (mcpo) with the "mcp" profile:
#
#   docker compose -f compose.yaml -f compose.dev.yaml --profile mcp up -d
#
# See docs/03-DEV-CONTAINER.md for the full walkthrough.

name: personal-agentic-ai

services:
  # ---------------------------------------------------------------------------
  # Human-facing dev environment: browser VS Code with the workspace mounted.
  # No Docker socket. Not an agent sandbox by itself.
  # ---------------------------------------------------------------------------
  devbox-config-init:
    image: codercom/code-server:${CODE_SERVER_TAG:-latest}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - devbox-config:/data
    restart: "no"

  devbox:
    image: codercom/code-server:${CODE_SERVER_TAG:-latest}
    container_name: devbox
    restart: unless-stopped
    depends_on:
      devbox-config-init:
        condition: service_completed_successfully
    command:
      - --auth
      - none
      - --bind-addr
      - 0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check
      - /workspace
    volumes:
      # Host workspace -> container. Keep this OUTSIDE the repo if you do not
      # want projects to be git-visible. Default: ./workspace (gitignored).
      - ${DEV_WORKSPACE:-./workspace}:/workspace
      - devbox-config:/home/coder/.local/share/code-server
    ports:
      - "127.0.0.1:${DEVBOX_LOCAL_PORT:-8443}:8080"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "${DEVBOX_TS_NAME:-dev}"
    networks: [ai]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: ${DEVBOX_MEM_LIMIT:-4g}
    cpus: "${DEVBOX_CPUS:-2.0}"

  # ---------------------------------------------------------------------------
  # Open Terminal: authenticated command/file API in isolated container.
  # Shares workspace with devbox; no Docker socket.
  # ---------------------------------------------------------------------------
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:${OPEN_TERMINAL_TAG:-latest}
    container_name: open-terminal
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY in .env}
    volumes:
      - ${DEV_WORKSPACE:-./workspace}:/home/user
    ports:
      - "127.0.0.1:${OPEN_TERMINAL_LOCAL_PORT:-8001}:8000"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "${OPEN_TERMINAL_TS_NAME:-terminal}"
    networks: [ai]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${OPEN_TERMINAL_MEM_LIMIT:-4g}
    cpus: "${OPEN_TERMINAL_CPUS:-2.0}"

  # ---------------------------------------------------------------------------
  # Agent tool bridge (optional, profile "mcp").
  # mcpo turns a stdio MCP server into an OpenAPI tool server that Open WebUI
  # can register under Settings > Admin > Integrations > External Tool Servers.
  # Shares the same workspace, runs WITHOUT the Docker socket.
  # ---------------------------------------------------------------------------
  mcp:
    image: ghcr.io/open-webui/mcpo:${MCPO_TAG:-main}
    container_name: mcp
    restart: unless-stopped
    profiles: [mcp]
    working_dir: /workspace
    command:
      - --config
      - /config/mcpo/config.json
      - --port
      - "8000"
      - --api-key
      - ${MCPO_API_KEY:?set MCPO_API_KEY in .env}
    volumes:
      - ./config/mcpo:/config/mcpo:ro
      - ${DEV_WORKSPACE:-./workspace}:/workspace
    ports:
      - "127.0.0.1:${MCPO_LOCAL_PORT:-8000}:8000"
    # Command allowlist lives in config/mcpo/config.json.
    networks: [ai]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${MCP_MEM_LIMIT:-2g}
    cpus: "${MCP_CPUS:-2.0}"

volumes:
  devbox-config:

# Reuse the network created by the core stack.
networks:
  ai:
    name: personal-agentic-ai
    external: true
