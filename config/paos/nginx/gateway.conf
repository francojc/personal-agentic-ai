# Worker-facing gateway filter: the ONLY path the worker uid may use is chat completions.
# Bifrost admin/API (dashboard, /api/*, /v1/mcp/*, models list, etc.) is never exposed here.
server {
  listen 8082;
  server_tokens off;
  client_max_body_size 1m;
  location = /v1/chat/completions {
    limit_except POST { deny all; }
    proxy_pass http://bifrost:8080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 130s;
    proxy_set_header Host $host;
  }
  location / { return 404; }
}
