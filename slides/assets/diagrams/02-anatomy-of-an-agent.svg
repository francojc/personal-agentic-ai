 x="800" y="459" font-size="20" fill="#7655BB" font-weight="700" text-anchor="middle">AGENT</text><text x="800" y="505" font-size="31" fill="#18263C" font-weight="700" text-anchor="middle">Pursues a goal</text><text x="800" y="548" font-size="22" fill="#596980" font-weight="400" text-anchor="middle">Chooses the next step</text></g><g id="takeaway"><text x="800" y="701" font-size="26" fill="#18263C" font-weight="600" text-anchor="middle">Capability comes from</text><text x="800" y="740" font-size="26" fill="#18263C" font-weight="600" text-anchor="middle">the combination.</text></g><g id="prompt-to-agent"><path d="M460 498 H627" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="agent-to-output"><path d="M973 498 H1132" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="output-response"><rect x="1135" y="422" width="380" height="152" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="1159" y="466" font-size="29" fill="#3266C7" font-weight="700" text-anchor="start">Output / response</text><text x="1159" y="510" font-size="25" fill="#18263C" font-weight="600" text-anchor="start">Deliver the result</text><text x="1159" y="547" font-size="20" fill="#596980" font-weight="400" text-anchor="start">Answer · artifact · result</text></g><g id="footer"><path d="M64 816 H1536" stroke="#C9D3E1"/><path d="M66 851 H111" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><text x="126" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Flow</text><path d="M210 851 H255" fill="none" stroke="#087D79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/><text x="270" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Feedback / context</text><text x="660" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Conceptual composition · capabilities depend on the implementation</text><text x="1536" y="859" font-size="18" fill="#596980" font-weight="600" text-anchor="end">04</text></g></g></svg>