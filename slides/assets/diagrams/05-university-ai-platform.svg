<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">University AI Platform</title><desc id="desc">A shared institutional experience, with model access and controls in the gateway. Proposed platform · arrows show logical flow, not deployment boundaries</desc><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3266C7"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087D79"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7655BB"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A86414"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="900" fill="#F7F8FC"/><g id="heading"><text x="64" y="53" font-size="18" fill="#596980" font-weight="700" text-anchor="start">AGENTIC AI  /  WORKING GROUP</text><text x="64" y="116" font-size="48" fill="#18263C" font-weight="700" text-anchor="start">University AI Platform</text><text x="66" y="159" font-size="25" fill="#596980" font-weight="400" text-anchor="start">A shared institutional experience, with model access and controls in the gateway.</text><rect x="1430" y="64" width="106" height="44" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="1483.0" y="94" font-size="24" fill="#3266C7" font-weight="600" text-anchor="middle">09</text></g><g id="label-people"><text x="94" y="264" font-size="18" fill="#3266C7" font-weight="700" text-anchor="start">PEOPLE</text><text x="94" y="292" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Teaching · research · services</text></g><g id="label-workspace"><text x="94" y="368" font-size="18" fill="#3266C7" font-weight="700" text-anchor="start">WORKSPACE</text><text x="94" y="396" font-size="18" fill="#596980" font-weight="400" text-anchor="start">A shared point of entry</text></g><g id="label-capabilities"><text x="94" y="470" font-size="18" fill="#7655BB" font-weight="700" text-anchor="start">CAPABILITIES</text><text x="94" y="498" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Context and action</text></g><g id="label-gateway"><text x="94" y="600" font-size="18" fill="#A86414" font-weight="700" text-anchor="start">GATEWAY</text><text x="94" y="628" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Model access and controls</text></g><g id="label-compute"><text x="94" y="766" font-size="18" fill="#7655BB" font-weight="700" text-anchor="start">COMPUTE</text><text x="94" y="794" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Provider and model choice</text></g><g id="people"><rect x="435" y="230" width="1040" height="60" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="955" y="270" font-size="28" fill="#3266C7" font-weight="600" text-anchor="middle">Students · faculty · researchers · staff</text></g><g id="people-to-workspace"><path d="M955 291 V331" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="open-webui"><rect x="435" y="334" width="1040" height="60" rx="22" fill="#EAF1FF" stroke="#3266C7" stroke-width="2"/><text x="955" y="374" font-size="31" fill="#3266C7" font-weight="700" text-anchor="middle">Open WebUI</text></g><g id="workspace-to-agent"><path d="M955 395 V435" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/></g><g id="knowledge"><path d="M435,438 H691 L715,462 V514 H435 Z M691,438