width="2"/><text x="959.0" y="778" font-size="23" fill="#7655BB" font-weight="600" text-anchor="middle">Claude</text><rect x="1052" y="748" width="154" height="44" rx="22" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="1129.0" y="778" font-size="23" fill="#7655BB" font-weight="600" text-anchor="middle">Gemini</text><rect x="1222" y="748" width="226" height="44" rx="22" fill="#F1EBFB" stroke="#7655BB" stroke-width="2"/><text x="1335.0" y="778" font-size="23" fill="#7655BB" font-weight="600" text-anchor="middle">Qwen / others</text></g><g id="footer"><path d="M64 816 H1536" stroke="#C9D3E1"/><path d="M66 851 H111" fill="none" stroke="#3266C7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/><text x="126" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Flow</text><path d="M210 851 H255" fill="none" stroke="#087D79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/><text x="270" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Feedback / context</text><text x="660" y="859" font-size="18" fill="#596980" font-weight="400" text-anchor="start">Proposed platform · arrows show logical flow, not deployment boundaries</text><text x="1536" y="859" font-size="18" fill="#596980" font-weight="600" text-anchor="end">09</text></g></g></svg>