# Bifrost learning stack. Multica uses separate upstream Compose project.
name: paos

services:
  bifrost:
    image: maximhq/bifrost:${BIFROST_TAG:?set BIFROST_TAG in .env}
    restart: unless-stopped
    environment:
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:?set stable encryption key}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:?set admin username}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:?set admin password}
    volumes:
      - bifrost-data:/app/data
      - ./config/bifrost/config.json:/app/data/config.json:ro
    ports:
      - "127.0.0.1:${BIFROST_LOCAL_PORT:-8081}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bifrost-data:
