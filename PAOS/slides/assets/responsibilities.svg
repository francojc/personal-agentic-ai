<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Different responsibilities, one connected workflow</title>
  <desc id="desc">Human direction and interpretation connect bidirectionally to a persistent work record. The work record connects to an investigating agent, which exchanges information with triage, model access, and tools and sources. Rules and permissions govern actions; model scores do not authorize them.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#527181" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
      .heading { font-size: 42px; font-weight: bold; fill: #123e57; }
      .label { font-size: 34px; font-weight: bold; }
      .detail { font-size: 28px; }
      .link { stroke: #527181; stroke-width: 3; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      rect { stroke-width: 2; rx: 16; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="white"/>
  <text x="50" y="62" class="heading">Different responsibilities. Connected work.</text>
  <rect x="340" y="98" width="600" height="100" fill="#fff0e6" stroke="#db9d78"/>
  <text x="640" y="139" text-anchor="middle" class="label">Human</text>
  <text x="640" y="177" text-anchor="middle" class="detail">Direction · interpretation · judgment</text>
  <path d="M640 207 V240" class="link"/>
  <rect x="245" y="250" width="790" height="104" fill="#eaf5ee" stroke="#86b599"/>
  <text x="640" y="292" text-anchor="middle" class="label">Work record</text>
  <text x="640" y="332" text-anchor="middle" class="detail">Questions · tasks · evidence · decisions</text>
  <path d="M640 364 V397" class="link"/>
  <rect x="425" y="407" width="430" height="104" fill="#e8f6f7" stroke="#70aeb5"/>
  <text x="640" y="450" text-anchor="middle" class="label">Agent</text>
  <text x="640" y="489" text-anchor="middle" class="detail">Investigate · compare · draft</text>
  <path d="M415 459 H380 V580 H370" class="link"/>
  <path d="M640 521 V548" class="link"/>
  <path d="M865 459 H900 V580 H910" class="link"/>
  <rect x="40" y="548" width="320" height="105" fill="#f1edff" stroke="#aaa0d4"/>
  <text x="200" y="590" text-anchor="middle" class="label">Triage</text>
  <text x="200" y="628" text-anchor="middle" class="detail">Suggest · flag · abstain</text>
  <rect x="430" y="558" width="420" height="95" fill="#eaf1ff" stroke="#87aadd"/>
  <text x="640" y="596" text-anchor="middle" class="label">Model access</text>
  <text x="640" y="631" text-anchor="middle" class="detail">Allowed providers · budgets</text>
  <rect x="920" y="548" width="320" height="105" fill="#fff6df" stroke="#d8bb71"/>
  <text x="1080" y="590" text-anchor="middle" class="label">Tools &amp; sources</text>
  <text x="1080" y="628" text-anchor="middle" class="detail">Search · read · record</text>
  <text x="640" y="698" text-anchor="middle" style="font-size:26px;fill:#526570">Rules and permissions govern actions. Scores do not authorize them.</text>
</svg>
